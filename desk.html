<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilot Desk — TripsToKenya</title>
    <meta
      name="description"
      content="Nairobi Pilot Desk: inbound from the agent, lodge holds, JKIA movements, and who is on the radio."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="inner" data-root="" data-page="desk">
    <div class="cursor-glow" aria-hidden="true"></div>
    <div data-include="overlays"></div>
    <div data-include="header"></div>

    <section class="page-hero desk-hero">
      <div class="page-hero-media" data-parallax="0.2">
        <img src="images/hotel-camp.jpg" alt="Tented camp deck at dusk on the Mara" />
      </div>
      <div class="page-hero-shade"></div>
      <div class="page-hero-copy">
        <p class="crumb"><a href="index.html">Home</a> <span>/</span> Desk <span>/</span> Pilot</p>
        <p class="desk-kicker">Staff only · Nairobi</p>
        <h1>Pilot Desk</h1>
        <p class="lede wide">
          The board the desk actually runs from. Inbound from the agent, lodge holds, JKIA movements, and who is on the radio.
        </p>
        <div class="desk-live" aria-live="polite">
          <span class="desk-live-dot" aria-hidden="true"></span>
          <span data-desk-clock>Friday 21 August 2026 · EAT</span>
          <span class="desk-live-sep" aria-hidden="true">·</span>
          <span>Amina Hassan on desk</span>
        </div>
      </div>
    </section>

    <main class="page-main desk-main">
      <div id="pilotDesk" class="pilot-desk" aria-label="Nairobi Pilot Desk"></div>
    </main>

    <div data-include="footer"></div>
    <script src="site.js"></script>
  </body>
</html>
